{# 任务配置表单(新建/修改共用)。
   依赖上下文变量:defaults(各字段值)、submit_url、submit_label、name_value #}
<form id="cfgform" class="form card">
  <h3>任务与设备</h3>
  <div class="grid2">
    <label>任务名称<input name="name" value="{{ name_value }}" placeholder="如:RK3576 fnOS 峰值轮" required></label>
    <label>设备型号<input name="device_model" value="{{ defaults.device_model }}"></label>
    <label>设备 IP<input name="device_ip" value="{{ defaults.device_ip }}" required></label>
    <label>Web 管理地址<input name="web_url" value="{{ defaults.web_url }}"></label>
    <label>盘位数量<input name="disk_count" type="number" min="1" value="{{ defaults.disk_count }}"></label>
    <label>硬盘描述<input name="disk_desc" value="{{ defaults.disk_desc }}"></label>
    <label>RAID 级别<input name="raid_level" value="{{ defaults.raid_level }}"></label>
    <label>存储卷路径<input name="volume_path" value="{{ defaults.volume_path }}" placeholder="留空自动探测(优先 /vol* 数据卷)"></label>
  </div>

  <h3>SSH 访问(自动化执行依赖)</h3>
  <div class="grid3">
    <label>SSH 用户<input name="ssh_user" value="{{ defaults.ssh_user }}"></label>
    <label>SSH 密码<input name="ssh_pass" type="password" value="{{ defaults.ssh_pass }}"></label>
    <label>SSH 端口<input name="ssh_port" type="number" value="{{ defaults.ssh_port }}"></label>
  </div>

  <h3>文件协议</h3>
  <div class="checkline">
    {% for p in ["SMB", "NFS", "FTP", "WebDAV"] %}
    <label class="chk"><input type="checkbox" name="protocols" value="{{ p }}"
      {{ 'checked' if p in defaults.protocols }}> {{ p }}</label>
    {% endfor %}
  </div>
  <div class="grid3">
    <label>协议测试用户<input name="smb_user" value="{{ defaults.smb_user }}"></label>
    <label>协议测试密码<input name="smb_pass" type="password" value="{{ defaults.smb_pass }}"></label>
    <label>FTP 端口<input name="ftp_port" type="number" value="{{ defaults.ftp_port }}"></label>
  </div>
  <div class="grid2">
    <label>WebDAV 地址<input name="webdav_url" value="{{ defaults.webdav_url }}"></label>
    <label>SMB 大文件(MB,完整验收建议 ≥4096)<input name="smb_bigfile_mb" type="number" value="{{ defaults.smb_bigfile_mb }}"></label>
  </div>

  <h3>测试纪律参数(方案 §3.3)</h3>
  <div class="grid3">
    <label>每用例轮数(取中位数)<input name="rounds" type="number" min="1" value="{{ defaults.rounds }}"></label>
    <label>fio 单轮时长(秒)<input name="fio_runtime" type="number" min="5" value="{{ defaults.fio_runtime }}"></label>
    <label>fio 测试文件大小(需 &gt; 内存)<input name="fio_size" value="{{ defaults.fio_size }}"></label>
    <label>热身时长(秒)<input name="warmup_seconds" type="number" min="0" value="{{ defaults.warmup_seconds }}"></label>
    <label>网卡线速(Mbps,算利用率)<input name="nic_link_mbps" type="number" value="{{ defaults.nic_link_mbps }}"></label>
    <label>iperf3 端口(逗号分隔)<input name="iperf_ports" value="{{ defaults.iperf_ports | join(',') }}"></label>
  </div>

  <h3>浸泡(S8,tier=持续)</h3>
  <div class="grid2">
    <label>浸泡时长(分钟,完整验收 ≥1440=24h)<input name="soak_minutes" type="number" min="1" value="{{ defaults.soak_minutes }}"></label>
    <label>采样间隔(秒)<input name="soak_sample_interval" type="number" min="5" value="{{ defaults.soak_sample_interval }}"></label>
  </div>

  <h3>本机测试客户端(可选全自动)</h3>
  <div class="grid2">
    <label>本机 sudo 密码(选填:自动装 iperf3/fio/cifs-utils/nfs-common、挂载、改 MTU)
      <input name="local_sudo_pass" type="password" value="{{ defaults.local_sudo_pass }}"></label>
    <label>本机测试目录<input name="local_test_dir" value="{{ defaults.local_test_dir }}"></label>
  </div>
  <div class="grid2">
    <label>本机 fio 自检目录(空=默认 NVMe 路径;勿用 tmpfs)<input name="local_fio_dir" value="{{ defaults.local_fio_dir }}"></label>
    <label>设备端测试目录<input name="device_test_dir" value="{{ defaults.device_test_dir }}"></label>
  </div>

  <div class="actions">
    <button class="btn btn-primary" type="submit">{{ submit_label }}</button>
    <span id="cfgform-msg" class="muted"></span>
  </div>
</form>
<script>
document.getElementById('cfgform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const cfg = {};
  f.querySelectorAll('input[name]').forEach(inp => {
    if (inp.name === 'protocols' || inp.name === 'iperf_ports') return;
    cfg[inp.name] = inp.value;
  });
  cfg.protocols = [...f.querySelectorAll('[name=protocols]:checked')].map(i => i.value);
  cfg.iperf_ports = f.querySelector('[name=iperf_ports]').value
    .split(',').map(s => parseInt(s.trim())).filter(n => n > 0);
  const resp = await fetch('{{ submit_url }}', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: f.querySelector('[name=name]').value, config: cfg})
  });
  const msg = document.getElementById('cfgform-msg');
  if (resp.ok) {
    const d = await resp.json();
    location.href = '/runs/' + d.run_id;
  } else {
    let err = await resp.text();
    try { err = JSON.parse(err).detail || err; } catch (_) {}
    msg.textContent = '保存失败: ' + err;
  }
});
</script>
